name: compare
run-name: compare ${{ inputs.vids }}
# Objective pacing/sound comparison of videos stored as assets of the "ref" release (first = judged one).
on:
  workflow_dispatch:
    inputs:
      vids:
        description: space-separated asset names, e.g. "au1.mp4 ea1.mp4"
        default: ea1.mp4
jobs:
  compare:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          mkdir -p ref out
          for v in ${{ inputs.vids }}; do gh release download ref -p "$v" -D ref; done
          python3 tools/compare.py out/compare.md $(for v in ${{ inputs.vids }}; do echo ref/$v; done)
          cat out/compare.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: compare, path: out, retention-days: 7}
