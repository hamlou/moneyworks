name: Render Episode 56 Short
run-name: Episode 56 dropshipping vertical short
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-short56.yml'
      - 'pipeline/episodes/ep56-short.json'
      - 'pipeline/photos/ep56.json'
      - 'pipeline/shorts/short56.md'
      - 'PLAYBOOK.md'
      - 'src/photo.tsx'
      - 'src/shorts/Short56.tsx'
      - 'src/Root.tsx'
permissions:
  contents: read
jobs:
  render-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts numpy pillow
          npm ci --no-audit --no-fund
      - name: Download licensed real photos
        run: python pipeline/photos.py ep56 --force
      - name: Generate English voiceover and word timings
        run: python pipeline/tts.py pipeline/episodes/ep56-short.json public/short56
      - name: Render vertical MP4
        run: |
          mkdir -p out
          npx remotion render src/index.ts Short56 out/episode-56-short.mp4 --props='{"timings":null}' --codec=h264 --crf=18 --pixel-format=yuv420p --audio-codec=aac --concurrency=2 --log=warn
      - name: Verify MP4
        run: ffprobe -v error -show_entries format=duration:stream=codec_name,width,height -of json out/episode-56-short.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: episode-56-vertical-short
          path: out/episode-56-short.mp4
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
