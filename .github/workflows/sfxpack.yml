name: sfxpack
on:
  workflow_dispatch:
    inputs:
      folder:
        description: Google Drive folder id
        default: 1oM8iV1-eOWRPM3UWzaFJ0jmBcy7dJ16v
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q gdown
      - run: gdown --folder "https://drive.google.com/drive/folders/${{ inputs.folder }}" -O raw || python -c "import gdown;gdown.download_folder('https://drive.google.com/drive/folders/${{ inputs.folder }}',output='raw',remaining_ok=True)"; find raw -type f | head -60
      - run: python pipeline/sfxpack.py
      - run: |
          git config user.name "Moneyworks Bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/sfx/pack
          git diff --cached --quiet || git commit -q -m "sfx pack import"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 7; done
