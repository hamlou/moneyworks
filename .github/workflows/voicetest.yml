name: voicetest
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts && pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
      - run: python pipeline/voicetest/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: voicetest
          path: voicetest/[1-4]_*.mp3
