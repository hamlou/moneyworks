name: render
run-name: render ${{ inputs.ep }}

on:
  workflow_dispatch:
    inputs:
      ep:
        description: Episode id (e.g. ep01)
        required: true
      chunks:
        description: Parallel render machines
        default: '12'

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts numpy
      - run: python pipeline/tts.py pipeline/episodes/${{ inputs.ep }}.json public/${{ inputs.ep }}
      - id: m
        run: echo "matrix=$(python pipeline/chunks.py ${{ inputs.ep }} ${{ inputs.chunks }})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: public/${{ inputs.ep }}
          retention-days: 1

  render:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: public/${{ inputs.ep }}
      - run: >
          npx remotion render src/index.ts Episode out/part.mkv
          --frames=${{ matrix.chunk.a }}-${{ matrix.chunk.b }}
          --codec=h264 --crf=18 --pixel-format=yuv420p --audio-codec=pcm-16
          --props='{"ep":"${{ inputs.ep }}","timings":null}'
          --concurrency=100% --log=warn
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk.i }}
          path: out/part.mkv
          retention-days: 1
          compression-level: 0

  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          name: voice
          path: public/${{ inputs.ep }}
      - run: >
          mkdir -p aud && for v in A B C; do npx remotion still src/index.ts ThumbV2 aud/thumb_$v.png
          --props="{\"ep\":\"${{ inputs.ep }}\",\"v\":\"$v\"}" --log=error || true; done
      - run: bash pipeline/assemble.sh ${{ inputs.ep }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ep }}-video
          path: final/*.mp4
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ep }}-kit
          path: |
            final/*.png
            final/*.txt
          retention-days: 90
