name: v6demo
run-name: v6 demo ${{ inputs.comp }}

# Renders a v6 (STYLE_3D.md) composition from src/v6/index.ts. 3D needs WebGL: --gl=swangle = software GPU on CI.
on:
  workflow_dispatch:
    inputs:
      comp:
        description: Composition id
        default: V6Demo

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Dave clips straight from the daveclips run (public/<id>/DAVE_RUN; owner PC never downloads them)
        env: {GH_TOKEN: "${{ github.token }}", COMP: "${{ inputs.comp }}"}
        shell: bash
        run: |
          ID=${COMP#Auto-}; ID=${ID#Map-}
          if [ -f public/$ID/DAVE_RUN ]; then
            gh run download $(cat public/$ID/DAVE_RUN) -n daveclips -D /tmp/dc
            mkdir -p public/$ID/dave && cp -r /tmp/dc/frames/* public/$ID/dave/
            cp /tmp/dc/dave_*.png /tmp/dc/dave_*.webm public/$ID/ 2>/dev/null || true
            ls public/$ID/dave
          fi
      - name: autopilot real YouTube clips (Creative Commons only, ≤ 8 s each)
        if: startsWith(inputs.comp, 'Auto-')
        env: {COMP: "${{ inputs.comp }}"}
        shell: bash
        run: |
          ID=${COMP#Auto-}
          if [ -s public/$ID/clips.json ] && [ "$(cat public/$ID/clips.json)" != "[]" ]; then
            pip install -q yt-dlp && python3 tools/clips.py $ID
          fi
      - name: autopilot shots straight from the Blender run (never via the owner's PC)
        if: startsWith(inputs.comp, 'Auto-')
        env: {GH_TOKEN: "${{ github.token }}", COMP: "${{ inputs.comp }}"}
        run: |
          ID=${COMP#Auto-}
          if [ -f public/$ID/SHOTS_RUN ]; then
            gh run download $(cat public/$ID/SHOTS_RUN) -n $ID-fast -D /tmp/shots || gh run download $(cat public/$ID/SHOTS_RUN) -n $ID-vert -D /tmp/shots  # vert = 9:16 Short
            cp /tmp/shots/shot_*.mp4 public/$ID/
            cp /tmp/shots/cut_*.png public/$ID/ 2>/dev/null || true
            ls public/$ID
          fi
        shell: bash
      - run: >
          npx remotion render src/v6/index.ts ${{ inputs.comp }} out/${{ inputs.comp }}.mp4
          --gl=swangle --codec=h264 --crf=18 --pixel-format=yuv420p --concurrency=100% --timeout=120000 --log=warn
      - name: 10 fps contact sheets for QA
        run: |
          mkdir -p out/sheets
          ffmpeg -v error -i out/${{ inputs.comp }}.mp4 -vf "fps=10,scale=320:-1,tile=8x5" out/sheets/s%02d.jpg
      - name: autopilot QA + compare vs ea1 (all on GitHub, owner PC is weak)
        if: startsWith(inputs.comp, 'Auto-')
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          V=out/${{ inputs.comp }}.mp4
          ffmpeg -v error -y -i $V -t 12 -vf "fps=4,scale=320:-1,tile=8x6" -frames:v 1 out/qa_hook.jpg
          ffmpeg -v error -y -i $V -vf "fps=1/6,scale=320:-1,tile=8x8" -frames:v 1 out/qa_sheet.jpg
          gh release download ref -p ea1.mp4 -D ref || true
          if [ -f ref/ea1.mp4 ]; then python3 tools/compare.py out/compare.md $V ref/ea1.mp4; else python3 tools/compare.py out/compare.md $V; fi
          cat out/compare.md >> "$GITHUB_STEP_SUMMARY"
          ID=${{ inputs.comp }}; cp public/${ID#Auto-}/clips_credits.json out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.comp }}
          path: out
          retention-days: 7
