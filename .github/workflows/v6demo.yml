name: v6demo
run-name: v6 demo ${{ inputs.comp }}

# Renders a v6 (STYLE_3D.md) composition from src/v6/index.ts. 3D needs WebGL: --gl=swangle = software GPU on CI.
on:
  workflow_dispatch:
    inputs:
      comp:
        description: Composition id
        default: V6Demo

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: >
          npx remotion render src/v6/index.ts ${{ inputs.comp }} out/${{ inputs.comp }}.mp4
          --gl=swangle --codec=h264 --crf=18 --pixel-format=yuv420p --concurrency=100% --log=warn
      - name: 10 fps contact sheets for QA
        run: |
          mkdir -p out/sheets
          ffmpeg -v error -i out/${{ inputs.comp }}.mp4 -vf "fps=10,scale=320:-1,tile=8x5" out/sheets/s%02d.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.comp }}
          path: out
          retention-days: 7
