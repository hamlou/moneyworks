name: blender
run-name: blender ${{ inputs.shot || 'taxshot' }} ${{ inputs.mode || 'auto' }}

# Real 3D shots the reference's way (STYLE_3D.md §12): Blender 4.2 LTS + CC0 Poly Haven models, Cycles on CPU.
# mode=preview → 4 stills at half res (layout check, ~5 min); mode=full → 120 frames, 4 parallel chunks → mp4.
on:
  push:
    paths: ['blender/**', '.github/workflows/blender.yml']
  workflow_dispatch:
    inputs:
      shot:
        description: blender/<shot>.py
        default: taxshot
      mode:
        description: preview | full
        default: preview
      samples:
        description: Cycles samples
        default: '32'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.p.outputs.chunks }}
      shot: ${{ steps.p.outputs.shot }}
      mode: ${{ steps.p.outputs.mode }}
      samples: ${{ steps.p.outputs.samples }}
      engine: ${{ steps.p.outputs.engine }}
      res: ${{ steps.p.outputs.res }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          SHOT=${{ inputs.shot }}; SHOT=${SHOT:-$(awk '{print $1}' blender/RUN)}
          MODE=${{ inputs.mode }}; MODE=${MODE:-$(awk '{print $2}' blender/RUN)}
          SAMPLES=${{ inputs.samples }}; SAMPLES=${SAMPLES:-$(awk '{print $3}' blender/RUN)}
          ENGINE=$(awk '{print $4}' blender/RUN); echo "engine=${ENGINE:-cycles}" >> $GITHUB_OUTPUT
          echo "shot=$SHOT" >> $GITHUB_OUTPUT; echo "mode=$MODE" >> $GITHUB_OUTPUT; echo "samples=$SAMPLES" >> $GITHUB_OUTPUT
          if [ -f blender/$SHOT.chunks ]; then
            echo "chunks=$(cat blender/$SHOT.chunks)" >> $GITHUB_OUTPUT
            case "$MODE" in full) R=1920x1080;; fast) R=1600x900;; *) R=960x540;; esac; echo "res=$R" >> $GITHUB_OUTPUT  # fast = 1600x900, upscaled to 1080p in the mp4 step (owner 31 Oct: ~2.5x quicker)
          elif [ "$MODE" = "full" ]; then
            echo 'chunks=["1-30","31-60","61-90","91-120"]' >> $GITHUB_OUTPUT; echo 'res=1920x1080' >> $GITHUB_OUTPUT
          else
            echo 'chunks=["5,30,60,95"]' >> $GITHUB_OUTPUT; echo 'res=960x540' >> $GITHUB_OUTPUT
          fi

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 16  # free plan = 20 concurrent jobs; keep 4 for voice/v6demo so they never queue behind a render
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-4.2.3
      - name: Blender 4.2 LTS
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender && curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1 xvfb libgl1-mesa-dri mesa-utils >/dev/null
          ~/blender/blender --version | head -1
      - uses: actions/cache@v4
        with:
          path: assets
          key: ph-${{ hashFiles('blender/fetch.py') }}-${{ needs.plan.outputs.shot }}
      - name: CC0 assets (Poly Haven)
        run: |
          python3 blender/fetch.py assets SchoolDesk_01 SchoolChair_01 wall_clock potted_plant_01 book_encyclopedia_set_01
          python3 blender/fetch_mocap.py assets 02_01 02_03 02_04 02_05
      - name: Render ${{ matrix.chunk }}
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          start=$(date +%s)
          xvfb-run -a -s "-screen 0 1920x1080x24" ~/blender/blender -b -P blender/${{ needs.plan.outputs.shot }}.py -- --assets assets --tex blender/tex --out out/frames \
            --frames "${{ matrix.chunk }}" --samples ${{ needs.plan.outputs.samples }} --res ${{ needs.plan.outputs.res }} --engine ${{ needs.plan.outputs.engine }} 2>&1 | grep -E "frame |Error|error|Traceback|skip|^  File" || true
          echo "render seconds: $(( $(date +%s) - start ))"
          ls out/frames | wc -l
          test -n "$(ls out/frames)"
      - id: n
        run: echo "name=$(echo '${{ matrix.chunk }}' | tr ',:' '__')" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ steps.n.outputs.name }}
          path: out/frames
          retention-days: 3

  assemble:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-*
          path: frames
          merge-multiple: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: mp4 + contact sheet
        run: |
          mkdir -p out
          ls frames | head
          # animated shots (anim.py): frames named <SHOT>_<n>.jpg → one mp4 per shot, then all shots joined
          if [ "${{ needs.plan.outputs.mode }}" != "preview" ] && ls frames/[A-Z]_*.jpg >/dev/null 2>&1; then
            : > list.txt
            for p in $(ls frames | grep -oE '^[A-Z]_' | sort -u | tr -d _); do
              ffmpeg -v error -framerate 24 -start_number 1 -i frames/${p}_%04d.jpg -vf "scale=1920:1080:flags=lanczos,vignette=PI/5,noise=alls=5:allf=t" -c:v libx264 -crf 21 -pix_fmt yuv420p out/shot_$p.mp4
              echo "file 'out/shot_$p.mp4'" >> list.txt
            done
            ffmpeg -v error -f concat -safe 0 -i list.txt -c copy out/${{ needs.plan.outputs.shot }}.mp4
            ffmpeg -v error -i out/${{ needs.plan.outputs.shot }}.mp4 -vf "fps=6,scale=320:-1,tile=8x6" out/sheet_%02d.jpg
          fi
          if [ "${{ needs.plan.outputs.mode }}" = "full" ] && ls frames/f_*.jpg >/dev/null 2>&1; then
            ffmpeg -v error -framerate 24 -i frames/f_%04d.jpg -c:v libx264 -crf 17 -pix_fmt yuv420p out/${{ needs.plan.outputs.shot }}.mp4
            ffmpeg -v error -i out/${{ needs.plan.outputs.shot }}.mp4 -vf "fps=8,scale=320:-1,tile=8x5" out/sheet_%02d.jpg
          fi
          cp frames/*.jpg frames/*.png out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.shot }}-${{ needs.plan.outputs.mode }}
          path: out
          retention-days: 7
