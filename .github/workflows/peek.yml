name: peek
run-name: peek
# one small contact sheet of every 3D shot (owner PC is weak: look before the 3 h final render). tools/PEEK = "<blender run id> <id>"
on:
  push:
    paths: [tools/PEEK]
permissions: {contents: write, actions: read}
jobs:
  peek:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          read RID ID < tools/PEEK
          gh run download $RID -n $ID-fast -D s
          mkdir -p f
          for v in s/shot_*.mp4; do n=$(basename $v .mp4); ffmpeg -v error -y -ss 1.5 -i $v -frames:v 1 -vf "scale=480:-1,drawtext=text=$n:x=10:y=10:fontsize=28:fontcolor=yellow:box=1:boxcolor=black" f/$n.jpg || true; done
          ffmpeg -v error -y -pattern_type glob -i 'f/*.jpg' -vf tile=4x3 -frames:v 1 $ID-peek.jpg
          gh release upload ref $ID-peek.jpg --clobber
