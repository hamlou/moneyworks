name: gate
run-name: short gate
# swipe-killer gate on Shorts stored on release "ref" (tools/GATE = asset names). Report in the run summary.
on:
  push:
    paths: [tools/GATE, tools/shortgate.py]
jobs:
  gate:
    runs-on: ubuntu-latest
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          for v in $(cat tools/GATE); do gh release download ref -p "$v" -D r; python3 tools/shortgate.py r/$v r/$v.md || true; cat r/$v.md >> "$GITHUB_STEP_SUMMARY"; done
